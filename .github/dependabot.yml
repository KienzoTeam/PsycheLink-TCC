version: 2
updates:
  # minor e patch chegam num PR só por app; major vem em PR próprio, para ler o changelog.
  - package-ecosystem: npm
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      server:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        update-types: [minor, patch]
    # Estes pacotes têm a versão fixada pelo SDK do Expo (o expo-doctor confere e o Expo Go traz o
    # nativo correspondente): nem patch pode vir daqui. Sobem só com `npx expo install --fix`.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-pager-view"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native-async-storage/async-storage"
      # O SDK aceita patch dos tipos (~19.3.x); só minor e major ficam de fora.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
